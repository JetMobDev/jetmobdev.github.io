<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Políticas de Privacidade - JetMobDev</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px 20px;
        }

        .search-box {
            margin-bottom: 30px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px;
            font-size: 1em;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .apps-list {
            display: grid;
            gap: 12px;
        }

        .app-item {
            padding: 15px 20px;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            border-radius: 8px;
            transition: all 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-item:hover {
            background: #e8ecff;
            border-left-color: #764ba2;
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .app-name {
            font-size: 1.1em;
            font-weight: 500;
            color: #333;
        }

        .app-arrow {
            color: #667eea;
            font-size: 1.2em;
            transition: transform 0.3s;
        }

        .app-item:hover .app-arrow {
            transform: translateX(5px);
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 1.1em;
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #e0e0e0;
            color: #666;
            font-size: 0.95em;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.95em;
            transition: background 0.3s;
        }

        .back-link:hover {
            background: #764ba2;
        }

        .stats {
            text-align: center;
            margin-bottom: 30px;
            padding: 15px;
            background: #e8ecff;
            border-radius: 8px;
            color: #667eea;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Políticas de Privacidade</h1>
            <p>JetMobDev - Índice de Políticas</p>
        </div>

        <div class="content">
            <a href="index.html" class="back-link">← Voltar ao Início</a>

            <div class="stats">
                <span id="app-count">Carregando...</span> aplicações disponíveis
            </div>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 Procurar aplicação...">
            </div>

            <div class="apps-list" id="apps-list">
                <!-- Será preenchido dinamicamente -->
            </div>

            <div class="no-results" id="no-results" style="display: none;">
                Nenhuma aplicação encontrada com esse nome.
            </div>
        </div>

        <div class="footer">
            <p>JetMobDev © 2026 | Todas as políticas de privacidade</p>
        </div>
    </div>

    <script>
        // Lista de apps com seus nomes formatados
        const apps = [
            { folder: 'Police', name: 'Police' },
            { folder: 'Tazer', name: 'Tazer' },
            { folder: 'aceleradormota', name: 'Acelerador Mota' },
            { folder: 'alarmefree', name: 'Alarme Free' },
            { folder: 'alarms_sounds', name: 'Alarms Sounds' },
            { folder: 'apito_canino', name: 'Apito Canino' },
            { folder: 'big_buzinas_new', name: 'Big Buzinas' },
            { folder: 'call_log_clear', name: 'Call Log Clear' },
            { folder: 'drum', name: 'Drum' },
            { folder: 'flash_notify', name: 'Flash Notify' },
            { folder: 'funny_horns_cars', name: 'Funny Horns Cars' },
            { folder: 'imc_adulto2', name: 'IMC Adulto' },
            { folder: 'imc_inf', name: 'IMC Infantil' },
            { folder: 'luz_zen', name: 'Luz Zen' },
            { folder: 'maquina_barbear', name: 'Máquina Barbear' },
            { folder: 'sabreluz', name: 'Sabre Luz' },
            { folder: 'sinos_e_campainhas', name: 'Sinos e Campainhas' },
            { folder: 'sons_grilos', name: 'Sons Grilos' },
            { folder: 'sopa_letras', name: 'Sopa Letras' },
            { folder: 'soundmachine', name: 'Sound Machine' },
            { folder: 'sport_timer', name: 'Sport Timer' },
            { folder: 'vibrador_digital', name: 'Vibrador Digital' }
        ];

        // Função para renderizar a lista
        function renderApps(filtro = '') {
            const appsList = document.getElementById('apps-list');
            const noResults = document.getElementById('no-results');
            const countSpan = document.getElementById('app-count');

            const filtered = apps.filter(app =>
                app.name.toLowerCase().includes(filtro.toLowerCase())
            );

            appsList.innerHTML = '';
            noResults.style.display = filtered.length === 0 ? 'block' : 'none';
            countSpan.textContent = filtro ? filtered.length : apps.length;

            filtered.forEach(app => {
                const link = document.createElement('a');
                link.href = `app/${app.folder}/privacy.html`;
                link.className = 'app-item';
                link.innerHTML = `
                    <span class="app-name">${app.name}</span>
                    <span class="app-arrow">→</span>
                `;
                appsList.appendChild(link);
            });
        }

        // Event listener para o campo de pesquisa
        document.getElementById('search-input').addEventListener('input', (e) => {
            renderApps(e.target.value);
        });

        // Renderizar apps ao carregar
        renderApps();
    </script>
</body>
</html>
