<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brute Pack · Convite de clã</title>
<meta name="description" content="Entra num clã no Brute Pack: treina o teu Bruto e luta com a tua equipa.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Brute Pack">
<meta property="og:title" content="Convite de clã no Brute Pack!">
<meta property="og:description" content="Toca para entrar no clã no jogo.">
<meta property="og:image" content="https://jetmobdev.github.io/app/meubruto/partilha.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="500">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icone.png">
<style>
  :root{--ink:#3a2412;--card:#fff8ec;--line:#e9c99a;--gold:#f5b81f;--gold-d:#c98a0c;--red:#c8401f;--muted:#7a5a3c}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#ffb347,#e2611a 70%);color:var(--ink);
       font:17px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center;padding:16px}
  main{width:100%;max-width:520px}
  .hero{width:100%;height:auto;border-radius:18px;display:block;box-shadow:0 6px 24px rgba(80,20,0,.35)}
  .card{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:22px 20px;margin-top:16px;text-align:center;
        box-shadow:0 6px 24px rgba(80,20,0,.25)}
  h1{margin:0 0 6px;font-size:1.6rem;line-height:1.2}
  p{margin:6px 0;color:var(--muted)}
  .code{display:inline-block;margin:12px 0 4px;padding:8px 18px;border:3px dashed var(--gold-d);border-radius:12px;
        font:800 1.9rem/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;color:var(--red);background:#fff}
  .btn{display:block;width:100%;margin:12px 0 0;padding:15px 18px;border:0;border-radius:14px;font-family:inherit;font-size:1.1rem;font-weight:800;line-height:1.2;
       text-decoration:none;cursor:pointer;color:var(--ink);background:linear-gradient(#ffd75a,var(--gold));box-shadow:0 4px 0 var(--gold-d)}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--gold-d)}
  .btn.alt{background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:700}
  .stores{display:flex;gap:10px}
  .stores .btn{flex:1;font-size:.95rem}
  .hint{font-size:.9rem;margin-top:14px}
  .hidden{display:none}
  footer{text-align:center;color:#fff3e0;font-size:.85rem;margin:18px 0 8px}
  footer a{color:#fff}
</style>
</head>
<body>
<main>
  <img class="hero" src="partilha.png" alt="Brute Pack" width="1024" height="500">
  <section class="card">
    <h1 id="title">Brute Pack</h1>
    <p id="text">Cria o teu Bruto, treina-o e entra num clã com os teus amigos.</p>
    <div id="codeBox" class="hidden"><span class="code" id="code"></span></div>
    <a class="btn" id="open" href="#">Entrar no clã no jogo</a>
    <button class="btn alt hidden" id="copy" type="button">Copiar código</button>
    <div class="stores">
      <a class="btn alt" id="play" href="https://play.google.com/store/apps/details?id=pt.jm.meubruto">Google Play</a>
      <a class="btn alt hidden" id="appstore" href="#">App Store</a>
    </div>
    <p class="hint hidden" id="fallback"></p>
    <p class="hint" id="hint">Ainda não tens o jogo? Instala-o e volta a tocar no link.</p>
  </section>
  <footer>JetMob · <a href="../../privacidade.html">Privacidade</a></footer>
</main>
<script>
(function () {
  // Mesmo formato que o jogo aceita (core/.../model/Links.kt): código de 4 a 12 letras ou números.
  var q = new URLSearchParams(location.search);
  var code = (q.get("cl") || "").trim();
  if (!/^[A-Za-z0-9]{4,12}$/.test(code)) code = "";
  code = code.toUpperCase();

  var pt = /^pt/i.test(navigator.language || "");
  var T = pt ? {
    title: "Convite para um clã!",
    text: "Abre o jogo e entra no clã. O líder vai receber o teu pedido.",
    open: "Entrar no clã no jogo", copy: "Copiar código", copied: "Código copiado!",
    hint: "Ainda não tens o jogo? Instala-o e volta a tocar no link.",
    hintFallback: "Não abriu? Copia o código e usa-o no jogo, em Clã."
  } : {
    title: "You're invited to a clan!",
    text: "Open the game and join the clan. The leader will receive your request.",
    open: "Join the clan in the game", copy: "Copy code", copied: "Code copied!",
    hint: "Don't have the game yet? Install it and tap the link again.",
    hintFallback: "Didn't open? Copy the code and use it in the game, under Clan."
  };
  var $ = function (id) { return document.getElementById(id); };
  document.documentElement.lang = pt ? "pt" : "en";
  $("open").textContent = T.open;
  $("copy").textContent = T.copy;
  $("hint").textContent = T.hint;

  if (!code) { $("open").classList.add("hidden"); return; }

  $("title").textContent = T.title;
  $("text").textContent = T.text;
  $("code").textContent = code;
  $("codeBox").classList.remove("hidden");
  $("copy").classList.remove("hidden");
  $("hint").textContent = T.hintFallback;

  var play = $("play").href;
  var android = /android/i.test(navigator.userAgent);
  // Android: o intent abre o jogo, ou a Play Store se não estiver instalado. iOS e outros: o esquema brutepack://.
  $("open").href = android
    ? "intent://cl/" + code + "#Intent;scheme=brutepack;package=pt.jm.meubruto;S.browser_fallback_url=" + encodeURIComponent(play) + ";end"
    : "brutepack://cl/" + code;

  // Se o jogo não abriu (a página continua à vista ao fim de 2 s), mostra a alternativa.
  $("open").addEventListener("click", function () {
    $("fallback").textContent = pt ? "Não abriu? Confirma que o jogo está instalado neste mesmo espaço do telemóvel, ou copia o código e usa-o no jogo, em Clã." : "Didn't open? Make sure the game is installed in this same space on your phone, or copy the code and use it in the game, under Clan.";
    setTimeout(function () { if (!document.hidden) $("fallback").classList.remove("hidden"); }, 2000);
  });

  $("copy").addEventListener("click", function () {
    var done = function () { $("copy").textContent = T.copied; };
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(done, done); else done();
  });
})();
</script>
</body>
</html>
